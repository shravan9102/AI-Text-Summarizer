<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🤖 AI Text Summarizer</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, Helvetica, sans-serif;
        }

        body{
            background:#f5f7fb;
        }

        .container{
            width:90%;
            max-width:900px;
            margin:40px auto;
            background:#fff;
            padding:30px;
            border-radius:12px;
            box-shadow:0 5px 20px rgba(0,0,0,.15);
        }

        h1{
            text-align:center;
            color:#ff7b00;
            margin-bottom:10px;
        }

        h3{
            text-align:center;
            color:#666;
            margin-bottom:25px;
        }

        p{
            margin-bottom:15px;
        }

        textarea{
            width:100%;
            height:220px;
            resize:none;
            padding:15px;
            font-size:16px;
            border-radius:8px;
            border:1px solid #ccc;
            outline:none;
        }

        textarea:focus{
            border:1px solid #ff7b00;
        }

        button{
            width:100%;
            margin-top:20px;
            padding:15px;
            border:none;
            border-radius:8px;
            background:#ff7b00;
            color:white;
            font-size:18px;
            cursor:pointer;
        }

        button:hover{
            background:#e76f00;
        }

        button:disabled{
            background:gray;
            cursor:not-allowed;
        }

        .output{
            margin-top:30px;
            background:#fff5ea;
            border:1px solid #ffcc99;
            border-radius:10px;
            padding:20px;
        }

        .output h2{
            color:#ff7b00;
            margin-bottom:15px;
        }

        #summary{
            white-space:pre-wrap;
            line-height:1.6;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>🤖 AI Text Summarizer</h1>
    <h3>Powered by Hugging Face T5 Transformer</h3>

    <p>Paste your article or dialogue below.</p>

    <form id="summaryForm">

        <textarea
            id="dialogue"
            placeholder="Enter your text here..."
            required></textarea>

        <button id="btn" type="submit">
            Summarize
        </button>

    </form>

    <div class="output">

        <h2>Summary</h2>

        <p id="summary">
            Your summary will appear here...
        </p>

    </div>

</div>

<script>

document.getElementById("summaryForm").addEventListener("submit", async function(e){

    e.preventDefault();

    const dialogue=document.getElementById("dialogue").value.trim();

    if(dialogue===""){
        alert("Please enter some text.");
        return;
    }

    const btn=document.getElementById("btn");
    const summary=document.getElementById("summary");

    btn.disabled=true;
    btn.innerHTML="Summarizing...";
    summary.innerHTML="Generating summary...";

    try{

        const response=await fetch("/summarize/",{

            method:"POST",

            headers:{
                "Content-Type":"application/json"
            },

            body:JSON.stringify({
                dialogue:dialogue
            })

        });

        if(!response.ok){
            throw new Error("Server Error");
        }

        const data=await response.json();

        summary.innerHTML=data.summary;

    }

    catch(error){

        summary.innerHTML="Error : "+error.message;

    }

    finally{

        btn.disabled=false;
        btn.innerHTML="Summarize";

    }

});

</script>

</body>
</html>
